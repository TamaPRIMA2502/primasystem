<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест на дислексію - PRIMA</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
    body { background: #3D134B; }
  </style>
</head>
<body>
  <iframe id="testFrame" title="PRIMA dyslexia test"></iframe>
  <script>
    const sourceFile = 'test-dyslexia-prima.html?v=ua-fixed-20260705-1';
    const oldScriptUrl = 'https://script.google.com/macros/s/AKfycbxPtDNZPz0x2Nt2SLDXTzEwQUiR7bpJE284pAXaYpk13y3_vreoW93gaLoHxNvxTFje/exec?lang=UA';
    const newScriptUrl = 'https://script.google.com/macros/s/AKfycby0X3BQUt8cluMqMfNcAszwZkxekfUJg3gOhX7eMBXN6JayqSSvyi6DvxJdRjvLIU8L/exec?lang=UA';

    fetch(sourceFile, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Could not load source test file');
        return response.text();
      })
      .then(html => {
        const patchedHtml = html.replace(oldScriptUrl, newScriptUrl);
        const blob = new Blob([patchedHtml], { type: 'text/html;charset=utf-8' });
        document.getElementById('testFrame').src = URL.createObjectURL(blob);
      })
      .catch(error => {
        document.body.innerHTML = '<div style="font-family:Arial,sans-serif;color:white;padding:32px;text-align:center">Не вдалося завантажити тест. Оновіть сторінку або спробуйте пізніше.</div>';
        console.error(error);
      });
  </script>
</body>
</html>
