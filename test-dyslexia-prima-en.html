<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dyslexia Test - PRIMA</title>
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;}</style>
</head>
<body>
  <iframe id="testFrame" title="PRIMA dyslexia test"></iframe>
  <script>
    const sourceFile = 'test-dyslexia-prima-en-fixed-button.html?v=en-20260705-3';
    const oldScriptUrl = 'https://script.google.com/macros/s/AKfycbwXcyeq7TjEG2A9bh3VlZPvEz20z8wlf9mmoqHdJsqVCbmANIaDr9WEuxHHGds4kzo_qw/exec';

    fetch(sourceFile, { cache: 'no-store' })
      .then(r => r.text())
      .then(html => {
        const patchedHtml = html.replace(oldScriptUrl, newScriptUrl);
        const blob = new Blob([patchedHtml], { type: 'text/html;charset=utf-8' });
        document.getElementById('testFrame').src = URL.createObjectURL(blob);
      });
  </script>
</body>
</html>
